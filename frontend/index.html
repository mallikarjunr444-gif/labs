          <section style="margin-bottom: 36px;">
            <h2 style="font-size: 24px; color: #141515; margin-bottom: 12px;">1. Clinical Mission &amp; Diagnostic Triage Overview</h2>
            <p>
              Medicus Labs™ was founded by <strong>Mallikarjun R</strong> to address the global shortage of dermatological specialists, where over 3 billion people face prolonged clinical waiting lists for routine cutaneous triage. By combining state-of-the-art vision transformer neural architectures with multi-center clinical datasets (including the International Skin Imaging Collaboration [ISIC], HAM10000, and DermNet clinical registries), our platform delivers probabilistic pre-screening insights, severity stratifications, and downloadable 1-page Clinical Intake Summaries for patient-doctor consultations.
            </p>
            <p style="margin-top: 12px;">
              Our algorithms evaluate lesion border symmetry, pigment distribution variegation, follicular plug congestion, and vascular erythema patterns to differentiate benign from potentially malignant cutaneous presentations.
            </p>
          </section>

          <section style="margin-bottom: 36px;">
            <h2 style="font-size: 24px; color: #141515; margin-bottom: 12px;">2. Peer-Referenced Clinical Dermatology Library (34 Comprehensive Guides)</h2>
            <p style="margin-bottom: 16px; font-size: 15px; color: #5A554A;">
              All clinical articles are authored and peer-referenced under the editorial direction of Mallikarjun R and the Medicus Labs Medical Advisory Board, aligned with WHO ICD-11 pathology standards:
            </p>

            <div style="display: grid; grid-template-columns: 1fr; gap: 12px; font-size: 14px;">
              <div><strong>Inflammatory &amp; Acneiform Dermatoses:</strong></div>
              <ul style="line-height: 1.9; margin-top: 4px; padding-left: 20px;">
                <li><a href="/blog/acne" style="color: #206E55; font-weight: bold;">Acne Vulgaris (ICD-11: 8A40 / DA01)</a> — Pathophysiology, Grade I-IV severity grading, C. acnes colonization, and topical retinoid therapeutics.</li>
                <li><a href="/blog/rosacea" style="color: #206E55; font-weight: bold;">Rosacea Subtypes (ICD-11: ED90)</a> — Centrofacial erythema, Demodex mite etiology, neurovascular triggers, and topical ivermectin.</li>
                <li><a href="/blog/acne-vs-rosacea" style="color: #206E55; font-weight: bold;">Acne Vulgaris vs. Rosacea Differential</a> — Comedone markers vs. telangiectatic flushing, misdiagnosis prevention, and tailored protocols.</li>
                <li><a href="/blog/perioral-dermatitis" style="color: #206E55; font-weight: bold;">Perioral Dermatitis</a> — Topical steroid rebound, follicular pustules, zero-therapy guidelines, and oral tetracyclines.</li>
                <li><a href="/blog/hidradenitis-suppurativa" style="color: #206E55; font-weight: bold;">Hidradenitis Suppurativa (ICD-11: ED92)</a> — Intertriginous sinus tracts, Hurley staging I-III, and anti-TNF biologics.</li>
                <li><a href="/blog/folliculitis" style="color: #206E55; font-weight: bold;">Folliculitis (Bacterial &amp; Pityrosporum)</a> — S. aureus vs. Malassezia fungal hair follicle infection and antimicrobial washes.</li>
              </ul>

              <div style="margin-top: 10px;"><strong>Eczematous, Autoimmune &amp; Scaling Dermatoses:</strong></div>
              <ul style="line-height: 1.9; margin-top: 4px; padding-left: 20px;">
                <li><a href="/blog/eczema" style="color: #206E55; font-weight: bold;">Atopic Dermatitis &amp; Eczema (ICD-11: EA80)</a> — FLG filaggrin barrier mutations, SCORAD severity index, ceramides, and dupilumab.</li>
                <li><a href="/blog/contact-dermatitis" style="color: #206E55; font-weight: bold;">Contact Dermatitis (Irritant vs. Allergic)</a> — Type IV delayed hypersensitivity, patch test protocols, and allergen avoidance.</li>
                <li><a href="/blog/seborrheic-dermatitis" style="color: #206E55; font-weight: bold;">Seborrheic Dermatitis</a> — Malassezia yeast proliferation, scalp and nasolabial cradle cap/scaling, and zinc pyrithione.</li>
                <li><a href="/blog/psoriasis" style="color: #206E55; font-weight: bold;">Plaque Psoriasis (ICD-11: EA90)</a> — Th17/IL-23 cytokine signaling, Auspitz bleeding sign, PASI score, and IL-17 inhibitors.</li>
                <li><a href="/blog/alopecia-areata" style="color: #206E55; font-weight: bold;">Alopecia Areata (ICD-11: ED70)</a> — Autoimmune T-cell hair follicle destruction, exclamation-point hairs, and JAK inhibitors.</li>
                <li><a href="/blog/vitiligo" style="color: #206E55; font-weight: bold;">Vitiligo (ICD-11: ED63)</a> — Autoimmune melanocyte destruction, Wood's lamp examination, and narrow-band UVB phototherapy.</li>
              </ul>

              <div style="margin-top: 10px;"><strong>Cutaneous Oncology &amp; Pre-Malignant Neoplasms:</strong></div>
              <ul style="line-height: 1.9; margin-top: 4px; padding-left: 20px;">
                <li><a href="/blog/melanoma" style="color: #206E55; font-weight: bold;">Cutaneous Melanoma (ICD-11: 2C30)</a> — ABCDE diagnostic criteria, Breslow invasion depth, dermoscopic blue-white veil, and wide excision.</li>
                <li><a href="/blog/basal-cell" style="color: #206E55; font-weight: bold;">Basal Cell Carcinoma (BCC) (ICD-11: 2C32)</a> — Pearly rolled borders, arborizing telangiectasias, ulceration, and Mohs micrographic surgery.</li>
                <li><a href="/blog/squamous-cell-carcinoma" style="color: #206E55; font-weight: bold;">Squamous Cell Carcinoma (cSCC) (ICD-11: 2C31)</a> — Hyperkeratotic exophytic nodules, sun-exposed fields, and metastatic risk staging.</li>
                <li><a href="/blog/actinic-keratosis" style="color: #206E55; font-weight: bold;">Actinic Keratosis (Pre-Cancerous AK)</a> — UV-induced intraepidermal keratinocyte dysplasia and topical 5-fluorouracil field therapy.</li>
                <li><a href="/blog/dysplastic-nevi" style="color: #206E55; font-weight: bold;">Dysplastic (Atypical) Nevi</a> — Atypical mole syndrome, architectural disorder, and serial digital dermoscopy surveillance.</li>
                <li><a href="/blog/keratoacanthoma" style="color: #206E55; font-weight: bold;">Keratoacanthoma</a> — Rapidly growing crateriform lesions with central keratin plugs and differentiation from SCC.</li>
                <li><a href="/blog/seborrheic-keratosis" style="color: #206E55; font-weight: bold;">Seborrheic Keratosis</a> — Benign epidermal proliferations with "stuck-on" greasy appearance and cryoablation options.</li>
                <li><a href="/blog/skin-tags" style="color: #206E55; font-weight: bold;">Skin Tags (Acrochordons)</a> — Benign fibrovascular papillomas, insulin resistance links, and sterile clinical excision.</li>
              </ul>

              <div style="margin-top: 10px;"><strong>Infectious, Viral, Fungal &amp; Pigmentary Conditions:</strong></div>
              <ul style="line-height: 1.9; margin-top: 4px; padding-left: 20px;">
                <li><a href="/blog/ringworm" style="color: #206E55; font-weight: bold;">Tinea Corporis &amp; Ringworm (ICD-11: 1F28)</a> — Trichophyton rubrum annular scaling plaques, KOH prep, and terbinafine.</li>
                <li><a href="/blog/tinea-versicolor" style="color: #206E55; font-weight: bold;">Tinea Versicolor (Pityriasis)</a> — Malassezia furfur dimorphism, hypopigmentation, and selenium sulfide therapy.</li>
                <li><a href="/blog/tinea-pedis" style="color: #206E55; font-weight: bold;">Tinea Pedis (Athlete's Foot)</a> — Macerated interdigital fissures, moccasin distribution, and barrier hygiene.</li>
                <li><a href="/blog/onychomycosis" style="color: #206E55; font-weight: bold;">Onychomycosis (Fungal Nail Infection)</a> — Subungual hyperkeratosis, nail plate dystrophy, and oral pulse antifungals.</li>
                <li><a href="/blog/shingles" style="color: #206E55; font-weight: bold;">Herpes Zoster (Shingles) (ICD-11: 1E91)</a> — Varicella zoster reactivation, dermatomal painful vesicles, and early valacyclovir.</li>
                <li><a href="/blog/molluscum-contagiosum" style="color: #206E55; font-weight: bold;">Molluscum Contagiosum (ICD-11: 1E70)</a> — Poxvirus umbilicated pearly papules, autoinoculation prevention, and spontaneous resolution.</li>
                <li><a href="/blog/impetigo" style="color: #206E55; font-weight: bold;">Impetigo (ICD-11: 1B70)</a> — Contagious superficial pyoderma, honey-colored serous crusts, and topical mupirocin.</li>
                <li><a href="/blog/melasma" style="color: #206E55; font-weight: bold;">Melasma</a> — Centrofacial hormonal hyperpigmentation, estrogen receptor sensitivity, and physical iron oxide sunscreen.</li>
                <li><a href="/blog/post-inflammatory-hyperpigmentation" style="color: #206E55; font-weight: bold;">Post-Inflammatory Hyperpigmentation (PIH)</a> — Post-injury melanocyte hyperactivity, tyrosinase inhibitors, and azelaic acid.</li>
                <li><a href="/blog/skincare-guide" style="color: #206E55; font-weight: bold;">Evidence-Based Dermatological Skincare</a> — Double-blind trials for retinoids, niacinamide, L-ascorbic acid, and ceramides.</li>
                <li><a href="/blog/retinoids-guide" style="color: #206E55; font-weight: bold;">Comprehensive Retinoids Guide</a> — Tretinoin, adapalene, tazarotene, and retinoic acid receptor cellular mechanisms.</li>
                <li><a href="/blog/skincare-oily-skin" style="color: #206E55; font-weight: bold;">Oily &amp; Blemish-Prone Skin Protocol</a> — Sebaceous gland regulation, 2% salicylic acid, and barrier-safe hydration.</li>
                <li><a href="/blog/how-ai-detects-skin-diseases" style="color: #206E55; font-weight: bold;">How AI Analyzes Cutaneous Lesions</a> — Vision transformers, spatial attention heatmaps, and false-positive reduction.</li>
                <li><a href="/blog/when-to-visit-dermatologist" style="color: #206E55; font-weight: bold;">When to Visit a Licensed Dermatologist</a> — Red flag symptoms, ulceration, rapid evolution, and diagnostic triage.</li>
              </ul>
