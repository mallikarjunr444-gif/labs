            <h2 style="font-size: 24px; color: #141515;">About Medicus Labs Platform</h2>
            <p>Medicus Labs is an advanced AI dermatology platform designed to analyze skin lesions, rash patterns, and cutaneous abnormalities using computer vision models trained on ISIC, HAM10000, and DermNet clinical archives. Founded by Mallikarjun R, our platform provides accessible pre-screening insights, clinical severity grading, and downloadable PDF reports for physician consultations.</p>
          </section>

            <ul style="line-height: 2.0; font-size: 15px;">
              <li><a href="/blog/acne" style="color: #206E55; font-weight: bold;">Acne Vulgaris Guide (ICD-11: 8A40 / DA01)</a> — Pathophysiology, Grade I-IV classification, C. acnes etiology, and topical retinoid management.</li>
              <li><a href="/blog/melanoma" style="color: #206E55; font-weight: bold;">Melanoma &amp; Dysplastic Nevi Guide (ICD-11: 2C30)</a> — ABCDE diagnostic rule, Clark level staging, dermoscopy markers, and AI early vision screening.</li>
              <li><a href="/blog/eczema" style="color: #206E55; font-weight: bold;">Atopic Dermatitis &amp; Eczema (ICD-11: EA80)</a> — Filaggrin barrier defects, moisture locking protocols, and Th2 cytokine inhibitors.</li>
              <li><a href="/blog/psoriasis" style="color: #206E55; font-weight: bold;">Plaque Psoriasis (ICD-11: EA90)</a> — Keratinocyte hyperproliferation, PASI evaluation standards, phototherapy, and IL-17/IL-23 biologics.</li>
              <li><a href="/blog/rosacea" style="color: #206E55; font-weight: bold;">Rosacea Subtypes (ICD-11: ED90)</a> — Erythematotelangiectatic to papulopustular classification, Demodex mite control, and anti-inflammatory regimens.</li>
              <li><a href="/blog/skincare-guide" style="color: #206E55; font-weight: bold;">Evidence-Based Dermatological Skincare</a> — Active ingredient synergy (retinoids, niacinamide, SPF) and Fitzpatrick phototype protocols.</li>
