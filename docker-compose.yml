# Medicus Labs Docker Configuration
version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
      - DATABASE_URL=postgresql://medicuslabs:medicuslabs@db:5432/medicuslabs
      - HF_API_TOKEN=${HF_API_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=https://my-domain.com,https://api.my-domain.com
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - medicuslabs-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=medicuslabs
      - POSTGRES_PASSWORD=medicuslabs
      - POSTGRES_DB=medicuslabs
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped
    networks:
      - medicuslabs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicuslabs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Service (optional)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - medicuslabs-network

volumes:
  postgres_data:

networks:
  medicuslabs-network:
    driver: bridge
